<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusDrop</title>
<style>
  :root {
    --bg: #0f1222;
    --card: #1a1f3a;
    --accent: #6c5ce7;
    --accent2: #00cec9;
    --text: #eef0ff;
    --muted: #9aa3c7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #2a2f5e 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .app { width: 100%; max-width: 520px; }
  header { text-align: center; margin-bottom: 20px; }
  h1 { font-size: 28px; letter-spacing: 1px; }
  h1 span { color: var(--accent2); }
  header p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .card {
    background: var(--card);
    border: 1px solid #2c3260;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  .setup label, .quick label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    background: #232849;
    border: 1px solid #3a4175;
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  .primary {
    width: 100%;
    margin-top: 14px;
    background: linear-gradient(90deg, var(--accent), #8f7bff);
    border: none; color: white;
    font-size: 15px; font-weight: 600;
    padding: 13px; border-radius: 10px;
    cursor: pointer;
  }
  .primary:disabled { opacity: .45; cursor: not-allowed; }
  .timerbox { text-align: center; display: none; }
  .task { color: var(--accent2); font-size: 15px; margin-bottom: 8px; }
  .clock { font-size: 64px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
  .clock.running { color: var(--accent2); }
  .clock.done { color: #ffcc57; }
  .help { color: var(--muted); font-size: 13px; margin: 6px 0 16px; }
  .row { display: flex; gap: 10px; }
  .ghost {
    flex: 1;
    background: #232849; border: 1px solid #3a4175; color: var(--text);
    padding: 12px; border-radius: 10px; font-size: 15px; cursor: pointer;
  }
  .danger { flex: 1; background: #7a2437; border: none; color: #ffd7de; padding: 12px; border-radius: 10px; font-size: 15px; cursor: pointer; }
  .log { margin-top: 22px; }
  .log h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .summary { font-size: 14px; color: var(--text); background: #232849; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
  .session {
    display: flex; justify-content: space-between; gap: 10px;
    background: #171c36; border: 1px solid #2c3260;
    padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; font-size: 14px;
  }
  .session .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .clear {
    margin-top: 6px; background: none; border: none; color: #8b93bd;
    font-size: 12px; cursor: pointer; text-decoration: underline;
  }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Focus<span>Drop</span></h1>
      <p>One task. One timer. A clean focus log.</p>
    </header>

    <section class="card setup" id="setupCard">
      <label for="taskInput">What are you focusing on?</label>
      <input type="text" id="taskInput" placeholder="e.g. Finish report draft" maxlength="80">
      <button class="primary" id="startBtn" disabled>Start 25-minute focus drop</button>
    </section>

    <section class="card timerbox" id="timerCard">
      <div class="task" id="taskLabel"></div>
      <div class="clock" id="clock">25:00</div>
      <div class="help" id="helpText">Focus time — the session is logged when it completes.</div>
      <div class="row">
        <button class="danger" id="dropBtn">Drop session</button>
        <button class="ghost" id="earlyDoneBtn">Finish early</button>
      </div>
    </section>

    <section class="card log">
      <h2>Your focus log</h2>
      <div class="summary" id="summary">0 sessions today</div>
      <div id="logList"><div class="empty" id="emptyMsg">No sessions yet — today is a fresh start.</div></div>
      <button class="clear" id="clearBtn">Clear log</button>
    </section>
  </main>

<script>
(function () {
  var DURATION = 25 * 60;
  var setupCard = document.getElementById("setupCard");
  var taskInput = document.getElementById("taskInput");
  var startBtn = document.getElementById("startBtn");
  var timerCard = document.getElementById("timerCard");
  var taskLabel = document.getElementById("taskLabel");
  var clock = document.getElementById("clock");
  var helpText = document.getElementById("helpText");
  var dropBtn = document.getElementById("dropBtn");
  var earlyDoneBtn = document.getElementById("earlyDoneBtn");
  var logList = document.getElementById("logList");
  var summary = document.getElementById("summary");
  var clearBtn = document.getElementById("clearBtn");
  var emptyMsg = document.getElementById("emptyMsg");
  var timer = null;
  var remaining = DURATION;
  var startedAt = null;

  taskInput.addEventListener("input", function () {
    startBtn.disabled = taskInput.value.trim().length === 0;
  });

  startBtn.addEventListener("click", beginSession);
  dropBtn.addEventListener("click", function () { endSession("dropped"); });
  earlyDoneBtn.addEventListener("click", function () { endSession("finished early"); });
  clearBtn.addEventListener("click", function () {
    localStorage.removeItem("focusdrop_sessions");
    renderLog();
  });

  taskInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !startBtn.disabled) beginSession();
  });

  function beginSession() {
    var task = taskInput.value.trim();
    if (!task) return;
    remaining = DURATION;
    startedAt = new Date();
    taskLabel.textContent = "Focusing on: " + task;
    clock.className = "clock running";
    helpText.textContent = "Focus time — the session is logged when it completes.";
    setupCard.style.display = "none";
    timerCard.style.display = "block";
    tick();
    timer = setInterval(tick, 1000);
  }

  function tick() {
    var m = Math.floor(remaining / 60);
    var s = remaining % 60;
    clock.textContent = (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    if (remaining <= 0) {
      clearInterval(timer);
      timer = null;
      clock.className = "clock done";
      clock.textContent = "Focus dropped";
      helpText.textContent = "Session complete — logged to your focus log.";
      logSession("completed", DURATION);
      setTimeout(function () { backToSetup(); }, 2500);
      return;
    }
    remaining--;
  }

  function endSession(status) {
    if (timer) { clearInterval(timer); timer = null; }
    if (status === "finished early" && remaining < DURATION) {
      logSession(status, DURATION - remaining);
    }
    backToSetup();
  }

  function backToSetup() {
    clock.className = "clock";
    clock.textContent = "25:00";
    setupCard.style.display = "block";
    timerCard.style.display = "none";
    taskInput.value = "";
    startBtn.disabled = true;
  }

  function todayKey() {
    return new Date().toDateString();
  }

  function logSession(status, secondsWorked) {
    var all = JSON.parse(localStorage.getItem("focusdrop_sessions") || "{}");
    var day = all[todayKey()] || [];
    day.unshift({
      task: taskInput.value.trim() || taskLabel.textContent.replace("Focusing on: ", ""),
      status: status,
      seconds: secondsWorked,
      at: startedAt.toTimeString().slice(0, 5)
    });
    all[todayKey()] = day;
    localStorage.setItem("focusdrop_sessions", JSON.stringify(all));
    renderLog();
  }

  function renderLog() {
    var all = JSON.parse(localStorage.getItem("focusdrop_sessions") || "{}");
    var day = all[todayKey()] || [];
    logList.innerHTML = "";
    if (emptyMsg && emptyMsg.parentNode === logList) logList.removeChild(emptyMsg);
    var completed = day.filter(function (s) { return s.status === "completed"; }).length;
    var mins = Math.round(day.reduce(function (a, s) { return a + s.seconds; }, 0) / 60);
    summary.textContent = "Today: " + completed + " completed session" + (completed === 1 ? "" : "s") + " · " + mins + " focused minute" + (mins === 1 ? "" : "s");
    if (day.length === 0) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "No sessions yet — today is a fresh start.";
      logList.appendChild(e);
      return;
    }
    day.forEach(function (s) {
      var d = document.createElement("div");
      d.className = "session";
      var minsWorked = Math.max(1, Math.round(s.seconds / 60));
      d.innerHTML = '<span>' + escapeHtml(s.task) + ' — ' + s.status + '</span><span class="t">' + s.at + " · " + minsWorked + "m</span>";
      logList.appendChild(d);
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  renderLog();
})();
</script>
</body>
</html>
